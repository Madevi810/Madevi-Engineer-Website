  <rect x="342" y="104" width="660" height="48" fill="#1e2a34"/>
  <text x="370" y="135" fill="#dbe7ed" font-family="Arial, sans-serif" font-size="15">Creative-Brief.md</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="376" y="190" fill="#6c8394">1</text><text x="414" y="190" fill="#f1f5f7"># UI/UX Creative Brief</text>
    <text x="376" y="236" fill="#6c8394">3</text><text x="414" y="236" fill="#8cd5ef">## Developer vision</text>
    <text x="376" y="268" fill="#6c8394">4</text><text x="414" y="268" fill="#c8d6df">- Web artikel modern, ringan, nyaman dibaca di HP</text>
    <text x="376" y="314" fill="#6c8394">6</text><text x="414" y="314" fill="#8cd5ef">## UI/UX reference choice</text>
    <text x="376" y="346" fill="#6c8394">7</text><text x="414" y="346" fill="#c8d6df">- Active reference: FigCraft public repository</text>
    <text x="376" y="378" fill="#6c8394">8</text><text x="414" y="378" fill="#c8d6df">- Categories: responsive layout, prototype flow</text>
    <text x="376" y="424" fill="#6c8394">10</text><text x="414" y="424" fill="#8cd5ef">## Inputs to confirm before simulation</text>
    <text x="376" y="456" fill="#6c8394">11</text><text x="414" y="456" fill="#c8d6df">- Mobile-first layout and reading hierarchy</text>
    <text x="376" y="488" fill="#6c8394">12</text><text x="414" y="488" fill="#c8d6df">- Calm color palette; reduced motion supported</text>
  </g>
