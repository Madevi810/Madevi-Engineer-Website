id: github-research
mode: external_read
purpose: Inspect an approved public repository for license, maintenance, compatibility, and evidence.
requires: [github_read_access, approved_research_scope]
permissions: [repository_read]
dry_run: true
approval_required: true
risk_level: medium
writes: [Foundation/16-External-Reference-Evidence]
fallback: Ask developer for public repository material or use official documentation.
audit_log: required
