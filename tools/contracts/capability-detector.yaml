id: capability-detector
mode: local_read
purpose: Report the tools and external access declared by the active runtime profile.
requires: [FOUNDATION_MANIFEST.yaml]
permissions: [workspace_read]
dry_run: true
approval_required: false
risk_level: low
writes: [Foundation/00-Control/Action-Journal.md, Foundation/00-Control/Jobs]
fallback: Report unknown or unavailable capability without guessing.
audit_log: required
