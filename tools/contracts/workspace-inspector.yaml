id: workspace-inspector
mode: local_read
purpose: Check the presence of required Foundation, agent, policy, tool, and evaluation artifacts.
requires: [workspace_read]
permissions: [workspace_read]
dry_run: true
approval_required: false
risk_level: low
writes: [Foundation/00-Control/Action-Journal.md, Foundation/00-Control/Jobs]
fallback: Run mew validate and report missing artifacts.
audit_log: required
