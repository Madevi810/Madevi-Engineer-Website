id: release-evaluator
mode: local_read
purpose: Run repository and Foundation release-readiness checks without publishing.
requires: [Foundation/12-Handover/Release-Readiness.md]
permissions: [workspace_read]
dry_run: true
approval_required: false
risk_level: medium
writes: [Foundation/00-Control/Action-Journal.md, Foundation/00-Control/Jobs]
fallback: Use mew release check and manual release review.
audit_log: required
