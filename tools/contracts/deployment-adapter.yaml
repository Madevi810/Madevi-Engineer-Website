id: deployment-adapter
mode: external_write
purpose: Execute an approved preview or production deployment through a configured provider adapter.
requires: [provider_adapter, approved_deployment_plan, developer_approval]
permissions: [provider_write]
dry_run: true
approval_required: true
risk_level: high
writes: [external_provider, Foundation/00-Control/Action-Journal.md]
fallback: Produce a manual deployment runbook.
audit_log: required
