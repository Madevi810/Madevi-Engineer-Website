schema_version: 1
plugins:
  - id: git
    name: Git local history
    default_status: optional
    purpose: Version history, branches, snapshots, and rollback.
    permissions:
      - local_repository_write
  - id: github
    name: GitHub integration
    default_status: disabled
    purpose: Remote repositories, issues, pull requests, releases, and CI.
    requires:
      - git
    permissions:
      - repository_read
      - repository_write
      - pull_request_create
  - id: deployment
    name: Deployment provider adapter
    default_status: disabled
    purpose: Provider-specific preview or production deployment planning.
  - id: scheduler
    name: Automation scheduler
    default_status: disabled
    purpose: Run approved autonomous-operation policies.
